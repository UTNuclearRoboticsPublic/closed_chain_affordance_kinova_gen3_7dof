# **Kinematic and ROS-Setup Info for the kinova_gen3_7dof robot** #
/**:
  ros__parameters:

    # ----------------------------------------------------------
    # Core robot parameters
    # ----------------------------------------------------------

    cca_robot: "kinova_gen3_7dof"
    cca_joint_states_topic: "/joint_states"
    rviz_fixed_frame: "base_link"

    # List of planning groups that will be loaded
    cca_planning_groups: ["manipulator"] # Groups representing desired kinematic chains for planning

    # ----------------------------------------------------------
    # Configuration for each planning group
    # ----------------------------------------------------------
    cca_planning_group_info:

      # -----------------------------
      # Planning group 1
      # -----------------------------
      manipulator:
        ref_frame: "base_link"

        kinematic_chain:
          base_joint: "joint_1"
          end_joint: "joint_7"

        end_effector:
          frame: "end_effector_link"
          gripper_joint_name: "robotiq_85_left_knuckle_joint"

        tool:
          frame: "cca_manipulator_tool"
          offset_from_ee_frame: [0.0, 0.0, 0.0] # Location of the tool in the EE frame. Example: [0.0, 0.0, 0.112]

        # Action servers for execution (robot or robot_and_gripper must be specified)
        robot_as: "/joint_trajectory_controller/follow_joint_trajectory"
        gripper_as: ""
        robot_and_gripper_as: ""
